<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация на Марафон</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f0f2f5; color: #333; }
        h1 { color: #007bff; }
        .card { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background: #007bff; color: white; }
        input, select, button { padding: 10px; margin: 5px 0; border-radius: 4px; border: 1px solid #ccc; width: 100%; max-width: 400px; display: block; }
        button { background: #007bff; color: white; border: none; cursor: pointer; width: auto; }
        button:hover { background: #0056b3; }
        .del-btn { background: #dc3545; padding: 5px 10px; width: auto; }
        .edit-btn { background: #ffc107; color: black; padding: 5px 10px; width: auto; margin-right: 5px; }
    </style>
</head>
<body>

<h1>🏃‍♂️ Регистрация участников марафона</h1>

<div class="card">
    <h3 id="formTitle">Зарегистрировать бегуна</h3>
    <input type="hidden" id="runnerId">

    <label>ФИО:</label>
    <input type="text" id="fullName" placeholder="Иванов Иван Иванович">

    <label>Номер телефона:</label>
    <input type="text" id="phone" placeholder="+7 (700) 000-00-00">

    <label>Дистанция:</label>
    <select id="distance">
        <option value="11 км">11 км</option>
        <option value="22 км">22 км</option>
        <option value="40 км">40 км</option>
    </select>

    <br>
    <button id="saveBtn" onclick="saveRunner()">Зарегистрировать</button>
    <button id="cancelBtn" onclick="resetForm()" style="background: #6c757d; display: none;">Отмена</button>
</div>

<div class="card">
    <h3>Список участников (сохраняется в marathon_runners.json)</h3>
    <button onclick="loadRunners()">Обновить список</button>
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>ФИО</th>
            <th>Телефон</th>
            <th>Дистанция</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<script>
    const API_URL = '/api/runners';
    window.onload = loadRunners;

    async function loadRunners() {
        const response = await fetch(API_URL);
        const data = await response.json();
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        data.forEach(r => {
            tbody.innerHTML += `
                    <tr>
                        <td>${r.id}</td>
                        <td>${r.fullName}</td>
                        <td>${r.phone}</td>
                        <td><b>${r.distance}</b></td>
                        <td>
                            <button class="edit-btn" onclick="startEdit(${r.id}, '${r.fullName}', '${r.phone}', '${r.distance}')">Изменить</button>
                            <button class="del-btn" onclick="deleteRunner(${r.id})">Удалить</button>
                        </td>
                    </tr>
                `;
        });
    }

    async function saveRunner() {
        const id = document.getElementById('runnerId').value;
        const runner = {
            fullName: document.getElementById('fullName').value,
            phone: document.getElementById('phone').value,
            distance: document.getElementById('distance').value
        };

        if (id) {
            await fetch(`${API_URL}/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(runner)
            });
        } else {
            await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(runner)
            });
        }

        resetForm();
        loadRunners();
    }

    function startEdit(id, fullName, phone, distance) {
        document.getElementById('runnerId').value = id;
        document.getElementById('fullName').value = fullName;
        document.getElementById('phone').value = phone;
        document.getElementById('distance').value = distance;

        document.getElementById('formTitle').innerText = 'Редактировать участника (ID: ' + id + ')';
        document.getElementById('saveBtn').innerText = 'Сохранить';
        document.getElementById('cancelBtn').style.display = 'inline-block';
    }

    function resetForm() {
        document.getElementById('runnerId').value = '';
        document.getElementById('fullName').value = '';
        document.getElementById('phone').value = '';

        document.getElementById('formTitle').innerText = 'Зарегистрировать бегуна';
        document.getElementById('saveBtn').innerText = 'Зарегистрировать';
        document.getElementById('cancelBtn').style.display = 'none';
    }

    async function deleteRunner(id) {
        await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
        loadRunners();
    }
</script>
</body>
</html>
